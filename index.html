function draw(){ ctx.clearRect(0,0,W,H); if(state.mode==='splash') drawSplash(); else if(state.mode==='store') drawStore(); else if(state.mode==='browse') drawBrowse(); else if(state.mode==='album') drawAlbumOverlay(); else if(state.mode==='cart') drawCart(); if(state.toastT>0){ const tw=Math.max(220,state.toast.length*9); pixelBox(W/2-tw/2,18,tw,38,'#171410'); text(state.toast,W/2,26,22,'#f6efd7','center'); } consumeClicks(); }
const keys=new Set();
function interact(){ if(state.mode==='splash'){state.mode='store'; return;} if(state.mode==='store'){ if(state.near?.type==='bin') openBrowse(state.near.year); else if(state.near?.type==='counter') state.mode='cart'; else if(state.near?.type==='station') showToast('A warm corner for future listening.'); } else if(state.mode==='browse') openAlbumDetail(selectedAlbum()); else if(state.mode==='album') state.mode='browse'; }
function secondary(){ if(state.mode==='browse'){ const a=selectedAlbum(); if(a) toggleAlbum(a); } else if(state.mode==='album'&&state.album) toggleAlbum(state.album); }
window.addEventListener('keydown',e=>{ const k=e.key.toLowerCase(); keys.add(k); if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if(k==='enter'||k==='e') interact();
  if(k==='f') secondary();
  if(k==='c'){ if(state.mode==='store'||state.mode==='browse'||state.mode==='album') state.mode='cart'; }
  if(k==='q'||k==='escape'){ if(state.mode==='browse') state.mode='store'; else if(state.mode==='album') state.mode='browse'; else if(state.mode==='cart') state.mode='store'; }
  if(state.mode==='browse'){ if(k==='arrowleft'||k==='a') browseMove(-1,0); if(k==='arrowright'||k==='d') browseMove(1,0); if(k==='arrowup'||k==='w') browseMove(0,-1); if(k==='arrowdown'||k==='s') browseMove(0,1); }
  if(state.mode==='cart'){ if(k==='1') copyText(spotifyPack(),'Spotify pack'); if(k==='2') copyText(applePack(),'Apple pack'); if(k==='3') copyText(m3uPack(),'M3U'); }
});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
canvas.addEventListener('mousemove',e=>{ const r=canvas.getBoundingClientRect(); mouse.x=(e.clientX-r.left)*(W/r.width); mouse.y=(e.clientY-r.top)*(H/r.height); });
canvas.addEventListener('mousedown',e=>{ const r=canvas.getBoundingClientRect(); mouse.x=(e.clientX-r.left)*(W/r.width); mouse.y=(e.clientY-r.top)*(H/r.height); mouse.clicked=true; });
let last=performance.now(); function frame(t){ const dt=Math.min(.033,(t-last)/1000); last=t; if(state.toastT>0) state.toastT-=dt; movePlayer(dt); if(state.mode==='browse') pageAlbums().forEach(queueArt); if(state.mode==='album'&&state.album) queueArt(state.album); draw(); requestAnimationFrame(frame); } updateNear(); requestAnimationFrame(frame);
</script>
</body>
</html>
